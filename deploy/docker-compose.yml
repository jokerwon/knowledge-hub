services:
  # PostgreSQL
  postgres:
    image: postgres:16
    container_name: knowledge_hub_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: knowledge_hub
    ports:
      - '5432:5432'
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d knowledge_hub']
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
    name: common-network
